# PROPUESTA — no se aplica desde aquí.
#
# `cloudflared` como paquete de MÁQUINA en `maquinas/kokoroco-central/capas/base.yml` del repo
# `priormyt/prior` (ese repo lo toca la Mac, por PR). Va en `base.yml` y no en `servicios.yml`:
# `servicios.yml` son recetas de contenedores, y los repositorios apt de terceros (docker,
# tailscale, nodesource) ya viven en `base.yml`, bajo «Repositorios de terceros en formato .list».
# Es el primer túnel de la máquina (ANTE, `wa.ante.photo`) y KokoroCo usará el mismo binario con
# su propio túnel y su propia unidad: por eso el paquete es de la máquina y las unidades son de
# cada proyecto (capa-proyectos-ante.propuesta.yml).
#
# Fuente de los comandos: https://pkg.cloudflare.com/index.html, instrucciones «Any Debian Based
# Distribution» (12 sep 2026). La página trae una línea genérica `any` y una para bookworm; no una
# para trixie, así que se usa `any`.
#
# Tres cambios, cada uno en su sitio de base.yml:

# ── 1 · En `vars.versiones_medidas`, cuando root lo instale y lo mida ─────────────
#      cloudflared: "<la que dé `cloudflared --version`>"   # ≥ 2025.4.0: --token-file

# ── 2 · La llave. NO pertenece a ningún paquete (como docker.gpg y nodesource.gpg): ─
#       se descarga, y se ANCLA su huella para que quien la reponga compruebe que es la misma.
- name: "Llave del repositorio de Cloudflare (se descarga; su huella se ancla)"
  ansible.builtin.get_url:
    url: https://pkg.cloudflare.com/cloudflare-main.gpg
    dest: /usr/share/keyrings/cloudflare-main.gpg
    mode: "0644"
    # checksum: "sha256:<la que mida root en PARA-ROOT.md, paso 6.1>"
  # HUECO hasta que root la mida: sin `checksum`, esta tarea confía en la descarga del día.

# ── 3 · El repositorio y el paquete ─────────────────────────────────────────────────
#       En la lista «Repositorios de terceros en formato .list», un elemento más:
#         - repo: "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main"
#           filename: cloudflared
#       Y en «Paquetes que definen esta máquina», un renglón más:
#         - cloudflared       # el túnel de Cloudflare; las unidades son de cada proyecto
#
# ⚠ Lo que esta capa NO hace, a propósito:
#   · No crea ningún túnel ni guarda ningún token: los túneles se administran desde el panel de
#     Cloudflare y su token es un secreto que se re-siembra (maquinas/kokoroco-central/SECRETOS.md).
#   · No habilita el `cloudflared.service` genérico ni corre `cloudflared service install`: esa
#     unidad deja el token en ExecStart, visible en `ps`. Cada proyecto trae la suya con
#     `--token-file` y la credencial cifrada.
#   · No abre puertos: el túnel sale de la máquina hacia Cloudflare. La regla de la casa
#     «nada en 0.0.0.0» se sigue cumpliendo (el agente escucha en 127.0.0.1).
